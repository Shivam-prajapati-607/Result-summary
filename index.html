<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor| Result summary</title>
    <meta name="description" content="A Result summary component challenge on Frontend Mentor.">
    <meta property="og:title" content="Frontend Mentor| Result summary">
    <meta property="og:description" content="A Profile card component challenge on Frontend Mentor.">
    <meta property="og:image" content="https://github.com/Shivam-prajapati-607/Result-summary/blob/main/images/demo.jpg">
    <meta property="og:type" content="website">

    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
    <main class="profile-result">
        <article class="result-bar">
            <section class="result_side">
                <h3>Your Result</h3>
               <div class="score">
                 <h1 class="scoreGain">76</h1>
                <h5>of 100</h5>
               </div>
                <h2>Great</h2>
                <p>You scored higher than 65% of the people who have taken these tests.</p>
            </section>
            <section class="summary_side">
                <h3>Summary</h3>
                <div class="info ">
                   <div class="title reaction">
                     <img src="./images/icon-reaction.svg" alt="reaction image">
                     <span>Reaction</span>
                   </div>
                    <div class="result">
                      <span>80</span>
                       <p> / 100</p>
                    </div>
                </div>
                <div class="info">
                   <div class="title memory">
                     <img src="./images/icon-memory.svg" alt="brain image">
                    <span>Memory</span>
                   </div>
                   <div class="result">
                     <span>92</span>
                    <p> / 100</p>
                   </div>
                </div>
                <div class="info ">
                  <div class="title verbal">
                      <img src="./images/icon-verbal.svg" alt="verbal image">
                    <span>Verbal</span>
                  </div>
                    <div class="result">
                        <span>61</span>
                    <p> / 100</p>
                    </div>
                </div>
                <div class="info "> 
                   <div class="title visual">
                     <img src="./images/icon-visual.svg" alt="visual image">
                    <span>Visual</span>
                </div>
                  <div class="result">
                      <span>73</span>
                      <p>/ 100</p>
                  </div>
                </div>
                <button class="btn">Continue</button>
            </section> 
        </article>
    </main>
   <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io/challenges/results-summary-component-CE_K6s0maV" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Shivam-prajapati-607" target="_blank">Shivam Prajapati</a>.
  </footer>
</body>
</html>
